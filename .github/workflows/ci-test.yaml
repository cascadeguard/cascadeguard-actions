# cascadeguard-actions — Run unit tests on PR
#
# Internal CI workflow (not a reusable workflow).
# Runs lib/ and integration tests on every pull request.

name: Test

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet pytest pyyaml

      - name: Run tests
        run: python -m pytest lib/tests/ -v
